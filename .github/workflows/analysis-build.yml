name: analysis-build

# Windows CLI build for recompilation analysis (docs/nx2/recomp-analysis.md): clang-cl, no Qt,
# no LTO, RelWithDebInfo so crashes and traces keep symbols. Run it from the Actions tab
# ("Run workflow") or push to analysis/recomp-build. The artifact has eden-cli.exe, the PDBs and
# the recomp scripts, so one download is enough to start.
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - "src/**"
      - "tools/nx2/recomp/**"
      - "docs/nx2/recomp-analysis.md"
      - "CMakeLists.txt"
      - ".github/workflows/analysis-build.yml"

permissions:
  contents: write

concurrency:
  group: analysis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-analysis-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake') }}
          restore-keys: cpm-analysis-

      - name: Restore compiler objects
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-analysis-${{ github.sha }}
          restore-keys: objects-analysis-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX"
          cmake -S . -B build/analysis -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF -DLICHII_TESTS=OFF \
            -DENABLE_QT=OFF -DLICHII_CMD=ON -DLICHII_ROOM=OFF -DLICHII_ROOM_STANDALONE=OFF \
            -DENABLE_WEB_SERVICE=OFF -DENABLE_UPDATE_CHECKER=OFF -DENABLE_WERROR=OFF \
            -DENABLE_DEBUG_TOOLS=ON -DLICHII_USE_BUNDLED_SDL3=ON -DUSE_DISCORD_PRESENCE=OFF \
            -DLICHII_BUILD_TAG=analysis-${{ github.run_number }} \
            -DLICHII_BUILD_PLATFORM=windows-x86_64-analysis \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /OPT:REF" \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: cmake --build build/analysis --target lichii-cmd --parallel

      - name: Stop sccache
        if: always()
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: objects-analysis-${{ github.sha }}-${{ github.run_id }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the probe and analyzer executables
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --name lichii-probe --paths tools/nx2/recomp --distpath build/tools tools/nx2/recomp/probe.py
          python -m PyInstaller --onefile --name lichii-analyze --paths tools/nx2/recomp --distpath build/tools tools/nx2/recomp/analyze_trace.py
          build/tools/lichii-probe.exe --help

      - name: Assemble package
        shell: pwsh
        run: |
          if (-not (Test-Path build/analysis/bin/eden-cli.exe)) { throw 'eden-cli.exe was not produced' }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse build/analysis/bin/* pkg/
          Copy-Item -Recurse tools/nx2/recomp pkg/recomp
          Copy-Item tools/nx2/nso_syms.py, tools/nx2/a64_coverage.py, tools/nx2/nso_dis.py, tools/nx2/npdm_info.py, tools/nx2/debug_mcp.py, tools/nx2/gdbrsp.py pkg/recomp/
          Copy-Item docs/nx2/recomp-analysis.md pkg/recomp/README.md
          Copy-Item build/tools/lichii-probe.exe, build/tools/lichii-analyze.exe pkg/recomp/

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: lichii-analysis-windows-${{ github.sha }}
          path: pkg/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the analysis-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd pkg && 7z a -tzip ../lichii-analysis-windows.zip . > /dev/null)
          gh release view analysis-latest > /dev/null 2>&1 || gh release create analysis-latest \
            --prerelease --target "$GITHUB_SHA" --title "Analysis build (latest)" \
            --notes "Windows CLI build for recompilation analysis. Unzip and run recomp\\run-analysis.ps1."
          gh release upload analysis-latest lichii-analysis-windows.zip --clobber
