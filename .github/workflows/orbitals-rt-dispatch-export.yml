name: orbitals-rt-dispatch-export

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-rt-dispatch-export.yml"

permissions:
  contents: read

jobs:
  inspect-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download matching host executable and DLL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output orbitals-recomp.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.zip"
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          z=ZipFile("orbitals-recomp.zip")
          for name in ("orbitals-recomp.exe","orbitalgame.dll"):
            data=z.read(name)
            Path(name).write_bytes(data)
            print(name,len(data))
          PY
      - name: Resolve rt_dispatch and hostfn call bridge
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y llvm
          llvm-readobj --coff-exports --coff-imports orbitals-recomp.exe > exe-pe-tables.txt
          llvm-readobj --coff-exports --coff-imports orbitalgame.dll > dll-pe-tables.txt
          grep -ni -C 5 'rt_dispatch' exe-pe-tables.txt dll-pe-tables.txt > rt-dispatch-pe-hits.txt || true
          llvm-objdump -d --demangle --no-show-raw-insn --disassemble-symbols=rt_dispatch orbitals-recomp.exe > rt-dispatch-disassembly.txt || true
          llvm-objdump -d --demangle --no-show-raw-insn --disassemble-symbols=fnprof_hit orbitals-recomp.exe > fnprof-hit-disassembly.txt || true
          for spec in \
            "dispatch_slow:0x140036660:0x140036800" \
            "dispatch_preempt:0x1400365d0:0x140036660" \
            "hostfn_dispatch_target:0x140036e50:0x140037050" \
            "hostfn_blocking_wrapper:0x140037bc0:0x140037c80" \
            "hostfn_tracked_wrapper:0x140037c10:0x140037c80" \
            "trace_context_helper:0x14002783c0:0x14002784c0" \
            "trace_logger:0x1400279d90:0x1400279f00" \
            "fnprof_hit_body:0x140020810:0x140020a00"; do
            IFS=: read -r name start stop <<< "$spec"
            llvm-objdump -d --demangle --no-show-raw-insn --start-address="$start" --stop-address="$stop" orbitals-recomp.exe > "$name.txt"
          done
          {
            echo "RT_DISPATCH PE TABLE HITS"
            cat rt-dispatch-pe-hits.txt
            echo
            echo "RT_DISPATCH"
            cat rt-dispatch-disassembly.txt
            echo
            echo "===== fnprof_hit-disassembly.txt ====="
            cat fnprof-hit-disassembly.txt
            for f in dispatch_slow.txt dispatch_preempt.txt hostfn_dispatch_target.txt hostfn_blocking_wrapper.txt hostfn_tracked_wrapper.txt trace_context_helper.txt trace_logger.txt fnprof_hit_body.txt; do
              echo
              echo "===== $f ====="
              cat "$f"
            done
          } > rt-dispatch-report.txt
          cat rt-dispatch-report.txt
      - name: Upload dispatch resolution
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-rt-dispatch-resolution
          path: |
            rt-dispatch-report.txt
            rt-dispatch-pe-hits.txt
            exe-pe-tables.txt
            dll-pe-tables.txt
            rt-dispatch-disassembly.txt
            dispatch_slow.txt
            dispatch_preempt.txt
            hostfn_dispatch_target.txt
            hostfn_blocking_wrapper.txt
            hostfn_tracked_wrapper.txt
            trace_context_helper.txt
            trace_logger.txt
            fnprof-hit-disassembly.txt
            fnprof_hit_body.txt
          if-no-files-found: error
          retention-days: 14
