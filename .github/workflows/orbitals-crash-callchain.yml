name: orbitals-crash-callchain

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-crash-callchain.yml"

permissions:
  contents: read

jobs:
  callchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source analysis tools
        uses: actions/checkout@v4
        with:
          repository: sinedgiveaways/pmocer-latibro
          ref: 50f4ec80d42ae0d81920eaebea22fa5f017dbc2a
          path: source
      - name: Download ExeFS
        run: |
          curl --fail --location --retry 3 -o exefs.zip "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/exefs.zip"
          mkdir exefs
          unzip -q exefs.zip -d exefs
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy lz4 capstone
      - name: Disassemble the crash caller and its callers
        run: |
          python - <<'PY'
          import sqlite3, tempfile, sys
          from pathlib import Path
          sys.path.insert(0, "source/tools/analisis")
          import frame_report as fr
          exefs=Path("exefs/exefs")
          with tempfile.TemporaryDirectory() as tmp:
              dbpath=Path(tmp)/"bindb.sqlite"
              fr.bindb.build(exefs, dbpath)
              db=sqlite3.connect(dbpath)
              rep=fr.Report(db, exefs)
              targets=[0x7001759B20,0x70017508E0,0x700174F720,0x7001718240]
              for addr in targets:
                  f=rep.function_at(addr)
                  rep.out("")
                  if not f:
                      rep.out(f"== {addr:#x}: no function found")
                      continue
                  rep.out(f"== guest function {addr:#x}: {rep.rel(f[0])}..{rep.rel(f[1])} size={(f[1]-f[0])//4} instructions")
                  rep.disasm(f[0],f[1],160)
                  calls=db.execute("SELECT target FROM call WHERE caller=? ORDER BY target LIMIT 100",(f[0],)).fetchall()
                  rep.out("  DIRECT CALL TARGETS:")
                  for (t,) in calls:
                      callee=rep.function_at(t)
                      rep.out(f"    {rep.rel(t)}" + (f" -> {callee[2]}" if callee and callee[2] else ""))
              db.close()
              Path("crash-callchain.txt").write_text("\\n".join(rep.lines)+"\\n",encoding="utf-8")
              print("\\n".join(rep.lines))
          PY
      - name: Upload call-chain disassembly
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-crash-callchain
          path: crash-callchain.txt
          retention-days: 14
