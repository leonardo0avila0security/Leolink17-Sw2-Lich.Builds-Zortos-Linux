name: orbitals-crash-callchain

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-crash-callchain.yml"

permissions:
  contents: read

jobs:
  callchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source analysis tools
        uses: actions/checkout@v4
        with:
          repository: sinedgiveaways/pmocer-latibro
          ref: 50f4ec80d42ae0d81920eaebea22fa5f017dbc2a
          path: source
      - name: Download ExeFS
        run: |
          curl --fail --location --retry 3 -o exefs.zip "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/exefs.zip"
          mkdir exefs
          unzip -q exefs.zip -d exefs
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy lz4 capstone
      - name: Disassemble the crash caller and its callers
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"source/recomp")
          from nso import Nso
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          main=bytes(Nso("exefs/exefs/main").image)
          base=0x7000000000
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          targets=[0x7001759B20,0x70017508E0,0x700174F720,0x7001718240]
          lines=["ORBITALS — EXACT GUEST CALL-CHAIN ANALYSIS",f"main base={base:#x} text size={len(main):#x}"]
          calls={t:[] for t in targets}
          # Scan all direct BL instructions in main for references to the stack-frame functions.
          for ins in md.disasm(main,base):
              if ins.mnemonic=="bl" and ins.op_str.startswith("#"):
                  try: dst=int(ins.op_str[1:],16)
                  except ValueError: continue
                  if dst in calls: calls[dst].append(ins.address)
          for t in targets:
              lines += ["",f"=== target {t:#x} (main+{t-base:#x}) direct BL callers: {len(calls[t])} ==="]
              for site in calls[t]:
                  lo=max(base,site-0x40); hi=min(base+len(main),site+0x30)
                  lines.append(f"-- callsite {site:#x} --")
                  for x in md.disasm(main[lo-base:hi-base],lo):
                      mark=" <CALL>" if x.address==site else ""
                      lines.append(f"  {x.address:#016x}: {x.mnemonic:8} {x.op_str}{mark}")
          # Exact instruction windows at each stack function start (independent of bindb's inferred boundaries).
          for t in targets:
              lo=t; hi=min(base+len(main),t+0x900)
              lines += ["",f"=== exact window {t:#x}..{hi:#x} ==="]
              for x in md.disasm(main[lo-base:hi-base],lo):
                  lines.append(f"  {x.address:#016x}: {x.mnemonic:8} {x.op_str}")
          Path("crash-callchain.txt").write_text("\\n".join(lines)+"\\n",encoding="utf-8")
          print("\\n".join(lines))
          PY
      - name: Upload call-chain disassembly
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-crash-callchain
          path: crash-callchain.txt
          retention-days: 14
