name: inspect-orbitals-setup-archives
on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/inspect-orbitals-setup-archive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download exact archives
        run: |
          curl -fL --retry 3 -o setup.zip "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/setup.zip"
          curl -fL --retry 3 -o orbitals-recomp.zip "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.zip"
      - name: Verify runtime launcher setup dependencies
        run: |
          python - <<'PY'
          import zipfile
          for archive in ("setup.zip","orbitals-recomp.zip"):
              print("\\n===== "+archive+" =====")
              with zipfile.ZipFile(archive) as z:
                  names=z.namelist()
                  for n in names:
                      low=n.lower()
                      base=n.rsplit("/",1)[-1].lower()
                      if (base in ("python.exe","pythonw.exe","python314.dll","python3.dll","orbitals-recomp.exe","setup-state.json","orbitals.ini","prepare.py","setup.py","setup.exe","readme.md","pyproject.toml")
                          or n.count("/")<=1):
                          print(n, z.getinfo(n).file_size)
                  print("TOTAL_FILES",len(names))
                  if archive=="setup.zip":
                      for n in ("setup/src/tools/prepare/prepare.py","setup/src/tools/prepare/gamesource.py","setup/src/tools/prepare/machine.py"):
                          if n in names:
                              data=z.read(n).decode("utf-8",errors="replace")
                              print("\\n===== "+n+" (tail) =====")
                              print(data[-10000:])
          PY
