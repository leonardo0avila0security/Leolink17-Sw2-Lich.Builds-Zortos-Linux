name: inspect-orbitals-runtime-setup-state
on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/inspect-orbitals-setup-archive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download runtime
        run: curl -fL --retry 3 -o runtime.zip "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.zip"
      - name: Read setup state and config
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("runtime.zip") as z:
              for n in ("setup-state.json","orbitals.ini","orbitalgame.id"):
                  print("\\n===== "+n+" =====")
                  try: print(z.read(n).decode("utf-8",errors="replace"))
                  except KeyError: print("MISSING")
          PY
