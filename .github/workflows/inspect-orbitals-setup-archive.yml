name: inspect-orbitals-runtime-setup-contract
on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/inspect-orbitals-setup-archive.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download runtime
        run: curl -fL --retry 3 -o runtime.zip "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.zip"
      - name: Inspect executable setup strings
        run: |
          python - <<'PY'
          import zipfile, re
          with zipfile.ZipFile("runtime.zip") as z:
              print("ROOTS",sorted({n.split("/",1)[0] for n in z.namelist()}))
              for n in z.namelist():
                  if n.lower().endswith("orbitals-recomp.exe"):
                      data=z.read(n)
                      print("EXE",n,"SIZE",len(data))
                      for enc in ("ascii","utf-16le"):
                          txt=data.decode(enc,errors="ignore")
                          for term in ("prepare.py","setup/python","setup-state.json","--source","source", "NUP", "Select game"):
                              hits=[m.start() for m in re.finditer(re.escape(term),txt,re.I)]
                              if hits: print(enc,term,[(txt[max(0,i-120):i+240]).replace("\\x00"," ") for i in hits[:5]])
                      break
              print("ROOT FILES")
              for n in z.namelist():
                  if n.count("/")<=1: print(n,z.getinfo(n).file_size)
          PY
