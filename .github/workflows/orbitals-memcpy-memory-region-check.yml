name: orbitals-memcpy-memory-region-check

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-memcpy-memory-region-check.yml"
      - "tools/nx2/check_orbitals_memcpy_regions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact crash dump
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output dump.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.exe.16952.dmp.zip"
          unzip -q dump.zip -d dump
          DUMP="$(find dump -type f -iname '*.dmp' -print -quit)"
          test -n "$DUMP"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"
      - name: Check mapped source and destination spans
        run: |
          python tools/nx2/check_orbitals_memcpy_regions.py "$DUMP" | tee memory-region-check.txt
      - name: Upload region report
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-memcpy-memory-region-check
          path: memory-region-check.txt
          if-no-files-found: error
          retention-days: 14
