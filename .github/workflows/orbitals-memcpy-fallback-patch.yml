name: orbitals-memcpy-fallback-patch

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-memcpy-fallback-patch.yml"
      - "tools/nx2/apply_orbitals_memcpy_fallback_patch.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-dll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download matching release archive
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output orbitals-recomp.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.zip"

      - name: Apply the source-field patch
        run: |
          python tools/nx2/apply_orbitals_memcpy_fallback_patch.py orbitals-recomp.zip -o orbitalgame.dll
          mkdir -p package
          cp orbitalgame.dll orbitalgame.dll.patch-report.txt tools/nx2/apply_orbitals_memcpy_fallback_patch.py package/
          printf '%s\n' \
            'DIAGNOSTIC ONLY — DO NOT USE FOR GAMEPLAY YET.' \
            'This patch only refreshes the memcpy source argument field.' \
            'The guest size remains 0x05240500 (86,246,656 bytes), larger than committed source and destination spans in dump 16952.' \
            'Applying this DLL may move the crash into an out-of-bounds copy.' \
            'Do not replace the installed DLL until the size-origin bug is resolved.' \
            'No setup.py, prepare.py, regeneration, or full rebuild is involved.' \
            > package/README.txt
          cd package
          zip -q -j ../orbitals-memcpy-fallback-patch.zip *

      - name: Upload patched DLL
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-memcpy-fallback-patch
          path: |
            orbitalgame.dll
            orbitalgame.dll.patch-report.txt
            orbitals-memcpy-fallback-patch.zip
          if-no-files-found: error
          retention-days: 14
