name: orbitals-memcpy-size-dword-scan

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-memcpy-size-dword-scan.yml"
      - "tools/nx2/scan_orbitals_size_dword.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact dump
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output dump.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.exe.16952.dmp.zip"
          unzip -q dump.zip -d dump
          DUMP="$(find dump -type f -iname '*.dmp' -print -quit)"
          test -n "$DUMP"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"
      - name: Scan captured ranges for size and stale source patterns
        run: |
          python tools/nx2/scan_orbitals_size_dword.py "$DUMP" | tee size-dword-scan.txt
      - name: Upload size pattern scan
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-memcpy-size-dword-scan
          path: size-dword-scan.txt
          if-no-files-found: error
          retention-days: 14
