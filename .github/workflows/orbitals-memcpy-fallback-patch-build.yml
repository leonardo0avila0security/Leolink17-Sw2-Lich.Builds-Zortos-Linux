name: orbitals-memcpy-fallback-patch-build

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-memcpy-fallback-patch-build.yml"
      - "tools/nx2/apply_orbitals_memcpy_fallback_patch.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4

      - name: Download exact dump-matching build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output orbitals-recomp.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.zip"

      - name: Apply version-locked source argument fix (DLL only)
        shell: bash
        run: |
          set -euo pipefail
          python tools/nx2/apply_orbitals_memcpy_fallback_patch.py orbitals-recomp.zip -o orbitalgame.dll
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile("orbitals-memcpy-fallback-patch.zip","w",zipfile.ZIP_DEFLATED) as z:
              z.write("orbitalgame.dll","orbitalgame.dll")
              z.write("orbitalgame.dll.patch-report.txt","patch-report.txt")
              z.write("tools/nx2/apply_orbitals_memcpy_fallback_patch.py","apply_patch.py")
              z.writestr("README.txt", """Orbitals memcpy fallback patch

Replace only orbitalgame.dll in the existing Orbitals Recomp installation.
Do not rerun setup.py, prepare.py, or regenerate/recompile the game.

This patch is locked to the exact orbitalgame.dll SHA/PDB identity listed in
patch-report.txt. Keep a backup of the original DLL. This is an analysis fix
candidate; static patch verification passed, but runtime gameplay testing is
still required.
""")
          PY
          ls -lh orbitalgame.dll orbitals-memcpy-fallback-patch.zip

      - name: Upload patched DLL and reproducible patch package
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-memcpy-fallback-patch
          path: |
            orbitalgame.dll
            orbitalgame.dll.patch-report.txt
            orbitals-memcpy-fallback-patch.zip
          if-no-files-found: error
          retention-days: 14
