name: orbitals-guest-memcpy-size-origin

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-guest-memcpy-size-origin.yml"
      - "tools/nx2/probe_orbitals_guest_table.py"
      - "tools/nx2/probe_orbitals_size_field.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact crash dump
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output dump.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.exe.16952.dmp.zip"
          unzip -q dump.zip -d dump
          DUMP="$(find dump -type f -iname '*.dmp' -print -quit)"
          test -n "$DUMP"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"
      - name: Validate guest array owner and exact size field
        run: |
          python tools/nx2/probe_orbitals_size_field.py "$DUMP" | tee guest-size-field-owner.txt
      - name: Upload guest size origin report
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-guest-memcpy-size-origin
          path: guest-size-field-owner.txt
          if-no-files-found: error
          retention-days: 14
