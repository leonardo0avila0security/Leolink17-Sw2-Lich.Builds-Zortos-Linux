name: orbitals-pdb-symbol-analysis

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-pdb-symbol-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbols:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download exact build package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output orbitals-recomp.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.zip"
          echo "f492332de899aa9799ecdf0be4fa55ae7856ad5d7a098aa12f6d2afa8c95d128  orbitals-recomp.zip" | sha256sum --check
          unzip -p orbitals-recomp.zip orbitalgame.dll.pdb > orbitalgame.dll.pdb
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile("orbitals-recomp.zip")
          names = z.namelist()
          print("EXE/PDB candidates in orbitals-recomp.zip:")
          for n in names:
              if "orbitals-recomp.exe" in n.lower() or (n.lower().endswith(".pdb") and "exe" in n.lower()):
                  print(n)
          exe = next((n for n in names if n.lower().endswith("orbitals-recomp.exe")), None)
          pdb = next((n for n in names if n.lower().endswith("orbitals-recomp.exe.pdb")), None)
          if exe:
              open("orbitals-recomp.exe", "wb").write(z.read(exe))
              print("Extracted", exe)
          if pdb:
              open("orbitals-recomp.exe.pdb", "wb").write(z.read(pdb))
              print("Extracted", pdb)
          PY
          ls -lh orbitalgame.dll.pdb orbitals-recomp.exe* 2>/dev/null || true
          unzip -Z1 setup-work.zip | grep -Ei '(hostfn|dispatch|nvn_api_core|cpu)' > setup-work-relevant-files.txt || true
          cat setup-work-relevant-files.txt | head -300

      - name: Download original ExeFS and matching generated object
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --output exefs.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/exefs.zip"
          echo "d98906b79f4948618441366609936a498436a26cc0cc09f183b499450a5149cb  exefs.zip" | sha256sum --check
          unzip -p exefs.zip exefs/main > main.nso
          curl --fail --location --retry 3 --retry-all-errors --output setup-work.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/setup-work.zip"
          echo "4daff8c457fb71de797e328c3eb0124170a3ef51677867cd71bcedbf66c30f40  setup-work.zip" | sha256sum --check
          unzip -p setup-work.zip setup-work/obj/main_main_0184.o > main_main_0184.o
          ls -lh main.nso main_main_0184.o

      - name: Install LLVM PDB reader
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Verify PDB identity and extract symbols
        shell: bash
        run: |
          set -euo pipefail
          command -v llvm-pdbutil
          if [ -f orbitals-recomp.exe.pdb ]; then
            llvm-pdbutil dump --summary orbitals-recomp.exe.pdb > exe-pdb-summary.txt
            llvm-pdbutil dump --publics orbitals-recomp.exe.pdb > exe-pdb-publics.txt
            llvm-pdbutil dump --globals orbitals-recomp.exe.pdb > exe-pdb-globals.txt
            {
              echo "=== EXE PDB SUMMARY ==="
              cat exe-pdb-summary.txt
              echo "=== EXE SYMBOLS NEAR RUNTIME DISPATCH / MEMCPY ==="
              grep -iE "40C00|40CE0|40CB0|40D1F|hostfn_entry|ov_memcpy|rt_dispatch|memcpy|memmove|guest_read" exe-pdb-publics.txt exe-pdb-globals.txt | head -500 || true
            } > exe-pdb-target-analysis.txt
            cat exe-pdb-target-analysis.txt
          else
            echo "orbitals-recomp.exe.pdb absent from release zip" > exe-pdb-target-analysis.txt
          fi

          llvm-pdbutil dump --summary orbitalgame.dll.pdb > pdb-summary.txt
          llvm-pdbutil dump --publics orbitalgame.dll.pdb > pdb-publics.txt
          llvm-pdbutil dump --globals orbitalgame.dll.pdb > pdb-globals.txt
          llvm-pdbutil dump --modules --files orbitalgame.dll.pdb > pdb-modules.txt
          llvm-pdbutil dump --section-headers --section-map --section-contribs orbitalgame.dll.pdb > pdb-section-layout.txt
          {
            echo "=== PDB SUMMARY ==="
            cat pdb-summary.txt
            echo
            echo "=== PUBLIC / GLOBAL SYMBOLS AROUND TARGET OFFSETS ==="
            grep -iE "1B5A[0-9A-F]{4}|1C11D[0-9A-F]{3}|f_7001759b20|1b5a9300|1c11df00" pdb-publics.txt pdb-globals.txt || true
            echo
            echo "=== SECTION CONTRIBUTIONS ==="
            cat pdb-section-layout.txt
            echo
            echo "=== RELEVANT MODULES / COMPILANDS ==="
            grep -iE "main_main|main\.cpp|orbitalgame|recomp" pdb-modules.txt | head -300 || true
          } > pdb-target-analysis.txt
          wc -l pdb-publics.txt pdb-globals.txt pdb-modules.txt
          cat pdb-target-analysis.txt

      - name: Disassemble original guest function and generated object
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check capstone lz4
          llvm-pdbutil dump --symbols --modi=667 orbitalgame.dll.pdb > pdb-mod667-symbols.txt
          llvm-objdump -t main_main_0184.o > object-symbols.txt
          llvm-objdump -d --no-show-raw-insn main_main_0184.o > object-disassembly.txt
          llvm-objdump -dr --no-show-raw-insn main_main_0184.o > object-relocations.txt
          grep -n -A100 -B5 "f_7001759b20" object-disassembly.txt > object-target-function.txt || true
          grep -n -B20 -A20 "198aa" object-relocations.txt > object-relocation-callsite.txt || true
          python - <<'PY'
          import re, struct
          from pathlib import Path
          import lz4.block
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN

          nso = Path("main.nso").read_bytes()
          if nso[:4] != b"NSO0":
              raise SystemExit(f"Not an NSO0 file: {nso[:4]!r}")
          flags = struct.unpack_from("<I", nso, 0x0C)[0]
          text_off, text_mem, text_size = struct.unpack_from("<III", nso, 0x10)
          text_file_size = struct.unpack_from("<I", nso, 0x60)[0]
          packed = nso[text_off:text_off+text_file_size]
          if len(packed) != text_file_size:
              raise SystemExit("Truncated NSO .text segment")
          if flags & 0x80:
              raise SystemExit("NSO uses ZBIC; LZ4 path is not valid")
          text = lz4.block.decompress(packed, uncompressed_size=text_size) if flags & 1 else packed
          if len(text) != text_size:
              raise SystemExit(f"Wrong .text size: {len(text):#x} != {text_size:#x}")

          publics = Path("pdb-publics.txt").read_text(encoding="utf-8", errors="replace")
          rows = []
          lines = publics.splitlines()
          for i, line in enumerate(lines[:-1]):
              m = re.search(r"`(f_700[0-9a-fA-F]+)`", line)
              a = re.search(r"addr = 0001:(\d+)", lines[i+1])
              if m and a:
                  rows.append((int(m.group(1)[2:], 16), int(a.group(1)), m.group(1)))
          rows.sort()
          target = 0x7001759B20
          matches = [i for i, row in enumerate(rows) if row[0] == target]
          if len(matches) != 1:
              raise SystemExit(f"Expected one public symbol f_{target:x}, found {len(matches)}")
          idx = matches[0]
          if idx+1 >= len(rows):
              raise SystemExit("No next guest function symbol found")
          next_guest = rows[idx+1][0]
          function_size = next_guest-target
          guest_base = 0x7000000000
          offset = target-guest_base-text_mem
          if offset < 0 or offset+function_size > len(text):
              raise SystemExit(f"Function range outside .text: off={offset:#x} size={function_size:#x} text={len(text):#x}")

          # Decompress .rodata/.data and resolve the import slots used by the two guest stubs.
          ro_off, ro_mem, ro_size = struct.unpack_from("<III", nso, 0x20)
          data_off, data_mem, data_size = struct.unpack_from("<III", nso, 0x30)
          ro_file_size = struct.unpack_from("<I", nso, 0x64)[0]
          data_file_size = struct.unpack_from("<I", nso, 0x68)[0]
          ro_packed = nso[ro_off:ro_off+ro_file_size]
          data_packed = nso[data_off:data_off+data_file_size]
          rodata = lz4.block.decompress(ro_packed, uncompressed_size=ro_size) if flags & 2 else ro_packed
          data = lz4.block.decompress(data_packed, uncompressed_size=data_size) if flags & 4 else data_packed
          def read_va(va, size):
              for base, blob in ((text_mem, text), (ro_mem, rodata), (data_mem, data)):
                  if base <= va and va+size <= base+len(blob):
                      return blob[va-base:va-base+size]
              return None
          dynstr_off, dynstr_size = struct.unpack_from("<II", nso, 0x90)
          dynsym_off, dynsym_size = struct.unpack_from("<II", nso, 0x98)
          dynstr = rodata[dynstr_off:dynstr_off+dynstr_size]
          dynsym = rodata[dynsym_off:dynsym_off+dynsym_size]
          mod0_off = struct.unpack_from("<I", text, 4)[0]
          if text[mod0_off:mod0_off+4] != b"MOD0":
              mod0_off = text.find(b"MOD0")
          dynamic_va = None
          dynamic_tags = {}
          if mod0_off >= 0 and text[mod0_off:mod0_off+4] == b"MOD0":
              dynamic_rel = struct.unpack_from("<i", text, mod0_off+4)[0]
              dynamic_va = mod0_off + dynamic_rel
              dyn_blob = read_va(dynamic_va, 0x1000)
              if dyn_blob:
                  for p in range(0, len(dyn_blob)-15, 16):
                      tag, value = struct.unpack_from("<qQ", dyn_blob, p)
                      if tag == 0:
                          break
                      dynamic_tags[tag] = value
          # Parse the NSO header's .dynsym/.dynstr extents and search RELA records directly.
          sym_names = {}
          interesting = []
          for sym_index in range(len(dynsym)//24):
              sym_off = sym_index*24
              st_name, st_info, st_other, st_shndx, st_value, st_size = struct.unpack_from("<IBBHQQ", dynsym, sym_off)
              if st_name < len(dynstr):
                  end = dynstr.find(b"\0", st_name)
                  if end < 0: end = len(dynstr)
                  name = dynstr[st_name:end].decode("utf-8", "replace")
              else:
                  name = ""
              sym_names[sym_index] = name
              if name.lower() in {"memcpy","memmove","memset","memcmp","memchr","bcopy","memcpy_s"}:
                  interesting.append((sym_index,name,st_shndx,st_value,st_size))
          import_lines = [
              f"NSO .rodata mem=0x{ro_mem:X} size=0x{ro_size:X} compressed=0x{ro_file_size:X}",
              f"NSO .data mem=0x{data_mem:X} size=0x{data_size:X} compressed=0x{data_file_size:X}",
              f"dynstr header offset=0x{dynstr_off:X} size=0x{dynstr_size:X}",
              f"dynsym header offset=0x{dynsym_off:X} size=0x{dynsym_size:X}",
              f"MOD0 offset={mod0_off:#x} dynamic VA={dynamic_va!r}",
          ]
          tag_names = {2:"DT_PLTRELSZ", 5:"DT_STRTAB", 6:"DT_SYMTAB", 7:"DT_RELA", 8:"DT_RELASZ", 9:"DT_RELAENT", 10:"DT_STRSZ", 11:"DT_SYMENT", 20:"DT_PLTREL", 23:"DT_JMPREL"}
          for tag, value in sorted(dynamic_tags.items()):
              import_lines.append(f"{tag_names.get(tag, hex(tag))} = 0x{value:X}")
          import_lines.append("DYNAMIC SYMBOLS OF INTEREST")
          for sym_index, name, shndx, value, size in interesting:
              import_lines.append(f"  sym#{sym_index}: {name} shndx={shndx} value=0x{value:X} size=0x{size:X}")
          for segment_name, blob in (("rodata", rodata), ("data", data)):
              for slot in (0x900A008, 0x900A010):
                  pattern = struct.pack("<Q", slot)
                  pos = blob.find(pattern)
                  found = 0
                  while pos >= 0 and found < 20:
                      if pos+24 <= len(blob):
                          r_offset, r_info, r_addend = struct.unpack_from("<QQq", blob, pos)
                          reloc_type = r_info & 0xFFFFFFFF
                          sym_index = r_info >> 32
                          if reloc_type == 1026 and sym_index < len(sym_names):
                              import_lines.append(f"RELA SCAN {segment_name}+0x{pos:X}: GOT+0x{r_offset:X} -> sym#{sym_index} {sym_names.get(sym_index,'')} type={reloc_type} addend={r_addend}")
                              found += 1
                      pos = blob.find(pattern, pos+1)
                  if found == 0:
                      import_lines.append(f"RELA SCAN {segment_name}: GOT+0x{slot:X} not found as r_offset")
          jmprel = dynamic_tags.get(23)
          pltrelsz = dynamic_tags.get(2, 0)
          if jmprel is not None and pltrelsz:
              rela_blob = read_va(jmprel, pltrelsz)
              if rela_blob:
                  import_lines.append("IMPORT RELOCATIONS IN GOT RANGE 0x900A000..0x900A100")
                  for p in range(0, len(rela_blob)-23, 24):
                      r_offset, r_info, r_addend = struct.unpack_from("<QQq", rela_blob, p)
                      if 0x900A000 <= r_offset < 0x900A100:
                          sym_index = r_info >> 32
                          sym_off = sym_index * 24
                          name = "<symbol-index-out-of-range>"
                          if sym_off+24 <= len(dynsym):
                              st_name = struct.unpack_from("<I", dynsym, sym_off)[0]
                              if st_name < len(dynstr):
                                  end = dynstr.find(b"\0", st_name)
                                  if end < 0: end = len(dynstr)
                                  name = dynstr[st_name:end].decode("utf-8", "replace")
                          import_lines.append(f"  GOT+0x{r_offset:X}: sym#{sym_index} {name} reloc_type={r_info & 0xFFFFFFFF} addend={r_addend}")
              else:
                  import_lines.append("DT_JMPREL address not readable from NSO segments")
          else:
              import_lines.append("DT_JMPREL / DT_PLTRELSZ not found; GOT slot names unresolved")
          md = Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          for stub in (0x70070C1DE0, 0x70070C1DF0):
              off = stub-0x7000000000-text_mem
              if 0 <= off < len(text):
                  code = text[off:min(len(text), off+0x30)]
                  import_lines.append(f"\nGUEST STUB 0x{stub:X}")
                  for ins in md.disasm(code, stub):
                      import_lines.append(f"0x{ins.address:016X}: {ins.mnemonic:8} {ins.op_str}")
          Path("guest-import-resolution.txt").write_text("\n".join(import_lines)+"\n", encoding="utf-8")

          md = Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          out = [
              "ORIGINAL ARM64 GUEST FUNCTION",
              f"NSO flags=0x{flags:X}",
              f".text mem=0x{text_mem:X} size=0x{text_size:X} compressed=0x{text_file_size:X}",
              f"symbol=f_{target:X} guest_start=0x{target:X}",
              f"next_symbol=f_{next_guest:X} inferred_size=0x{function_size:X}",
              f"text_offset=0x{offset:X}",
              "",
          ]
          for ins in md.disasm(text[offset:offset+function_size], target):
              out.append(f"0x{ins.address:016X}: {ins.mnemonic:8} {ins.op_str}")
          Path("guest-function-7001759b20.asm").write_text("\n".join(out)+"\n", encoding="utf-8")
          print("\n".join(out))
          PY
          {
            echo "=== MATCHING PDB COMPILAND 667 ==="
            grep -n -A100 -B5 "f_7001759b20" pdb-mod667-symbols.txt || true
            echo
            echo "=== GENERATED OBJECT TARGET FUNCTION ==="
            cat object-target-function.txt
          } > target-function-analysis.txt
          cat target-function-analysis.txt

      - name: Upload PDB symbol reports
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-pdb-symbol-analysis
          path: |
            pdb-summary.txt
            pdb-publics.txt
            pdb-globals.txt
            pdb-modules.txt
            pdb-section-layout.txt
            pdb-target-analysis.txt
            pdb-mod667-symbols.txt
            exe-pdb-summary.txt
            exe-pdb-publics.txt
            exe-pdb-globals.txt
            exe-pdb-target-analysis.txt
            setup-work-relevant-files.txt
            object-symbols.txt
            object-target-function.txt
            object-relocations.txt
            object-relocation-callsite.txt
            guest-function-7001759b20.asm
            guest-import-resolution.txt
            target-function-analysis.txt
          if-no-files-found: error
          retention-days: 14
