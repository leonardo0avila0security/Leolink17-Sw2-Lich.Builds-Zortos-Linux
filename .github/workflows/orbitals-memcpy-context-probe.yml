name: orbitals-memcpy-context-probe

on:
  push:
    branches:
      - analysis/recomp-build
    paths:
      - ".github/workflows/orbitals-memcpy-context-probe.yml"
      - "tools/nx2/probe_orbitals_memcpy_context.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout analysis tools
        uses: actions/checkout@v4
      - name: Download exact dump asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbitals-dump"
          cd "$RUNNER_TEMP/orbitals-dump"
          curl --fail --location --retry 3 --retry-all-errors \
            --output dump.zip \
            "https://github.com/sinedgiveaways/tool/releases/download/analysis-data/orbitals-recomp.exe.16952.dmp.zip"
          echo "1046109831d1fa9451e3d8a047bbb07fd286a289c12035bebaf786f7b51f7dbd  dump.zip" | sha256sum --check
          unzip -q dump.zip -d extracted
          DUMP="$(find extracted -type f \( -iname '*.dmp' -o -iname '*.mdmp' \) -print -quit)"
          test -n "$DUMP"
          echo "$DUMP" > "$RUNNER_TEMP/orbitals-dump/path.txt"
          ls -lh "$DUMP"
      - name: Probe expected source and context reuse
        shell: bash
        run: |
          set -euo pipefail
          python tools/nx2/probe_orbitals_memcpy_context.py "$(cat "$RUNNER_TEMP/orbitals-dump/path.txt")" | tee memcpy-context-probe.txt
      - name: Upload compact probe report
        uses: actions/upload-artifact@v7
        with:
          name: orbitals-memcpy-context-probe
          path: memcpy-context-probe.txt
          if-no-files-found: error
          retention-days: 14
